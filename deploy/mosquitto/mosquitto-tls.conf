# MQTTS: TLS 1.2+ with username/password. See docs/MQTTS.md for generating
# the CA, server certificate and password file.
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
allow_anonymous false
password_file /mosquitto/config/passwords
persistence false
log_dest stdout
