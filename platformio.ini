; Two bulb variants from one codebase. The variant only changes which LED
; channels exist; everything else (protocol, setup, OTA) is shared.
;
;   pio run -e rgbw          build the RGB + cool-white bulb
;   pio run -e rgbcct        build the RGB + tunable-white bulb
;   pio test -e native       run the unit tests on your computer

[platformio]
default_envs = rgbw, rgbcct

[esp8266]
platform = espressif8266@4.2.1
framework = arduino
board = esp01_1m
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.1m64.ld
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.2.1
build_flags =
    -DFIRMWARE_VERSION=\"1.0.0\"
    -Wall

; Pin numbers below match a common ESP8266 bulb layout. Check your board
; before flashing and adjust - the wrong pin on a mains bulb is a dead bulb.

[env:rgbw]
extends = esp8266
build_flags =
    ${esp8266.build_flags}
    -DBULB_MODEL=\"RGBW\"
    -DPIN_R=4 -DPIN_G=12 -DPIN_B=14
    -DPIN_CW=5

[env:rgbcct]
extends = esp8266
build_flags =
    ${esp8266.build_flags}
    -DBULB_MODEL=\"RGBCCT\"
    -DPIN_R=4 -DPIN_G=12 -DPIN_B=14
    -DPIN_CW=5 -DPIN_WW=13

[env:native]
platform = native
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson@7.2.1
build_flags = -std=gnu++17 -Wall
