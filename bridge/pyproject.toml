[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bulb-bridge"
version = "1.0.0"
description = "Cloud bridge for the ESP8266 smart bulbs: REST, OAuth 2.0, signed webhooks, WebSockets over MQTT/MQTTS"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "paho-mqtt>=2.1",
    "pydantic>=2.9",
    "PyJWT>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["bulb_bridge*", "simulators*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
